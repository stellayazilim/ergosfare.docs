name: Deploy Astro (Starlight) site to GitHub Pages

on:
  push:
    branches: ["main"]   # Deploy only when main branch is updated
  workflow_dispatch:      # Allow manual trigger
  repository_dispatch:
    # Sent by stellayazilim/ergosfare when the public API surface changes. It no
    # longer refreshes anything by itself — the API reference is committed, so a
    # rebuild republishes whatever is in the tree. Treat the dispatch as a signal
    # that someone needs to run `task api` and commit the result.
    types: [api-changed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          # 22 for `tsx` and the generator scripts; Starlight itself is happy on 20.
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install --frozen-lockfile

      # The API reference is generated locally and committed, so there is nothing
      # to fetch here. It used to be produced at deploy time, which needed a
      # cross-repo PAT to dispatch docfx in stellayazilim/Ergosfare; that secret
      # was never set, so the step skipped on every run and /api 404'd in
      # production while working locally. Regenerate with `task api` from the
      # superproject when the public API surface changes.

      - name: Build Astro site
        run: npm run build

      - name: Generate no Jekyll file
        # Must precede the upload: Astro emits `_astro/`, and anything added
        # after the artifact is packed never reaches Pages.
        run: echo "" > ./docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs  # Astro outputs to docs/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
